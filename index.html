<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NZ Railway Learning Adventure</title><style>
:root{--navy:#17314a;--blue:#21618c;--yellow:#ffcf4b;--cream:#fff9e9;--red:#d65c49;--green:#2e806e}*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:var(--navy);background:repeating-linear-gradient(90deg,#d7e7e8 0 12px,#e7f1ef 12px 24px)}header{background:var(--navy);color:white;padding:22px 20px 28px;text-align:center;border-bottom:9px solid var(--yellow)}header .eyebrow{letter-spacing:3px;font-weight:bold;font-size:.8rem;color:var(--yellow)}h1{margin:8px 0;font-size:clamp(1.9rem,5vw,3.5rem)}header p{margin:0;color:#dceaf3}.shell{max-width:1120px;margin:auto;padding:22px}.rail{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:3px solid var(--navy);border-radius:20px;padding:14px;position:relative;overflow:auto}.rail:before{content:'';position:absolute;left:8%;right:8%;top:50%;border-top:6px dashed #bdcbd0;z-index:0}.stop{z-index:1;border:3px solid var(--navy);border-radius:16px;padding:13px 9px;background:var(--cream);color:var(--navy);font-weight:900;cursor:pointer;min-width:120px;flex:1;transition:transform .15s}.stop:hover,.stop:focus-visible{transform:translateY(-3px);outline:3px solid var(--yellow)}.stop.active{background:var(--yellow)}.stop span{display:block;font-size:1.5rem}.stop small{display:block;font-weight:normal;margin-top:4px}.board{margin-top:22px;background:#fffef9;border:4px solid var(--navy);border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:8px 8px 0 #a8c7ca}.stationhead{display:flex;align-items:center;gap:15px;border-bottom:3px dashed #b9ced2;padding-bottom:16px;margin-bottom:20px}.stationicon{font-size:3rem;background:#e4f0f4;border-radius:20px;padding:12px}.stationhead h2{font-size:clamp(1.5rem,4vw,2.4rem);margin:0}.stationhead p{margin:4px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{border:2px solid #b6cbd1;background:#f4f9f8;border-radius:18px;padding:20px}.panel h3{margin-top:0}.mini{background:#fff5d3;border-color:#e4bf54}.placeholder{text-align:center;border:3px dashed #a8bdc3;border-radius:18px;background:#f5fafb;padding:55px 20px}.placeholder .big{font-size:4rem}.placeholder p{max-width:440px;margin:12px auto;color:#476277}.checkin{margin-top:18px;background:#e9f4ef;border:2px solid #8dbba6;border-radius:18px;padding:22px}textarea{width:100%;min-height:130px;border:2px solid #8daab6;border-radius:12px;padding:14px;font:inherit;resize:vertical;background:white}button.action{background:var(--green);color:white;border:0;border-radius:12px;padding:13px 20px;font-weight:bold;font-size:1rem;cursor:pointer;margin-top:12px}button.action:hover{filter:brightness(.9)}.status{margin-left:12px;font-size:.9rem;color:#256b4f}.ticket{display:inline-block;background:var(--yellow);border:2px dashed var(--navy);border-radius:8px;padding:7px 12px;font-weight:bold;font-size:.85rem;margin-bottom:12px}.trainart{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:18px;font-size:2.3rem}.trainart:after{content:'━━━━━━━';color:#738d99;font-size:1rem}footer{text-align:center;padding:26px;color:#456271;font-size:.85rem}.muted{color:#506d7a}.instruction{font-size:.9rem;color:#496676} @media(max-width:650px){.rail{display:grid;grid-template-columns:1fr 1fr}.rail:before{display:none}.stop{min-width:0}.grid{grid-template-columns:1fr}.shell{padding:12px}.board{box-shadow:4px 4px 0 #a8c7ca}.stationhead{align-items:flex-start}}
.mini h4{margin:20px 0 8px}.mini blockquote{margin:10px 0;padding:12px 15px;border-left:4px solid var(--yellow);background:#fff9e9;line-height:1.8}.mini hr{border:0;border-top:1px solid #ddd;margin:20px 0}.wordbank{overflow-x:auto}.wordbank table{width:100%;border-collapse:collapse;font-size:.9rem}.wordbank th,.wordbank td{border:1px solid #d9d9d9;padding:10px;text-align:left;vertical-align:top}.wordbank th{background:#fff0c2}.reading-layout{display:grid;gap:18px}.reading-layout .panel{background:#fff}.bookviewer{width:100%;height:570px;border:2px solid #9eb9c3;border-radius:12px;background:#e5eef2}.reading-bank{background:#fff4cf;border:2px solid #e2bb53;padding:15px;border-radius:12px}.reading-bank p{margin-bottom:0;line-height:1.8}.cloze-text{line-height:2.4}.blank{width:135px;max-width:100%;padding:8px;border:2px solid #94afbb;border-radius:7px;font:inherit;background:#fff}.blank.correct{border-color:#278253;background:#e8f9ee}.blank.incorrect{border-color:#c98134;background:#fff1db}.question{display:block;margin:18px 0;font-weight:600;line-height:1.5}.question textarea{display:block;margin-top:8px;min-height:88px;font-weight:normal}.reading-save{background:#e9f4ef;padding:18px;border-radius:15px;border:2px solid #8dbba6}.reading-layout h4{margin-top:26px}@media(max-width:650px){.bookviewer{height:420px}.blank{width:115px}}.book-pages{max-height:640px;overflow-y:auto;display:grid;gap:14px;padding:12px;background:#e8eef4;border:3px solid #17314a;border-radius:16px}.book-page{margin:0;background:white;padding:8px;border-radius:10px}.book-page img{display:block;width:100%;height:auto}.book-page figcaption{text-align:center;font-size:12px;color:#4b5563;margin-top:5px}

.writing-work{display:grid;gap:20px}.writing-work .panel{background:#fff}.writing-work h3{color:#17314a}.writing-work .prompt{padding:13px;background:#fff6d9;border-left:5px solid #ffcf4b;border-radius:8px;margin:12px 0}.writing-work label{display:block;font-weight:bold;margin:12px 0 6px}.writing-work textarea{min-height:75px}.writing-work .long-answer{min-height:200px}.writing-work .wordchips{background:#eaf4f5;border:2px dashed #9dbbc5;padding:15px;border-radius:12px;line-height:2}.writing-work .choice{display:block;padding:10px;background:#f2f7f9;border-radius:9px;margin:7px 0;font-weight:normal}.writing-work .choice input{margin-right:9px}.writing-work .subtle{color:#526b7a;font-size:.9rem}
</style></head><body><header><div class="eyebrow">ALL ABOARD • AOTEAROA EXPRESS</div><h1>🚂 NZ Railway Learning Adventure</h1><p>Four stations. One amazing learning journey.</p></header><main class="shell"><nav class="rail" aria-label="Learning stations"><button class="stop active" data-station="home"><span>🏠</span>Home Station<small>Auckland</small></button><button class="stop" data-station="reading"><span>📚</span>Reading Station<small>Hamilton</small></button><button class="stop" data-station="handwriting"><span>✏️</span>Handwriting Station<small>Wellington</small></button><button class="stop" data-station="writing"><span>📝</span>Writing Station<small>Christchurch</small></button></nav><section class="board" id="view" aria-live="polite"></section><div class="trainart" aria-hidden="true">🚂 🚃 🚃 🚃</div></main><footer>Next stop: new discoveries! • Made for a Phase 3.1 learner</footer><script>

const hwSheets=[
{letter:'A a',upper:'A',lower:'a',focus:'Start at the top for capital A with straight, even diagonal lines. For lowercase a, make a smooth round curve first, then a straight stick down that sits right on the line.',words:['cakes','parrot','landcrabs'],sentence:'The cat ate all the cakes.',circle:'a'},
{letter:'E e',upper:'E',lower:'e',focus:'Make capital E with one tall straight back and three neat horizontal bars. For lowercase e, start in the middle, go straight across, and curve smoothly up and around.',words:['elephants','queen','tea'],sentence:'He asked his friend to tea.',circle:'e'},
{letter:'I i',upper:'I',lower:'i',focus:'Keep capital I tall and straight. For lowercase i, make a short straight stick sitting on the line, and place a small, neat dot right above it (not a giant circle).',words:['king','nip','inside'],sentence:'There was a big crowd inside the cat.',circle:'I and i'},
{letter:'O o',upper:'O',lower:'o',focus:'Make both O and o smooth, round ovals that close neatly at the top. Make sure capital O reaches the top line and lowercase o stays half as tall.',words:['donkey','road','soldiers'],sentence:'The cat went along the road until he met an old man.',circle:'o'},
{letter:'U u',upper:'U',lower:'u',focus:'Curve smoothly around the bottom so your U and u don’t look like a pointy V. For lowercase u, finish with a straight stick down on the right side.',words:['hungry','hundred','cut'],sentence:'The landcrabs began to cut a hole in the cat.',circle:'u'}];
let currentHw=0;
function handwritingMarkup(){return `<div class="hw-panel"><h3>✏️ Handwriting Practice — No More Cakes</h3><p>Choose a vowel sheet. Use your finger, touchscreen pen, or mouse to write on the ruled lines. Your handwriting can be saved on this device.</p><div class="hw-tabs">${hwSheets.map((x,i)=>`<button class="hw-tab ${i===currentHw?'active':''}" data-sheet="${i}">Sheet ${i+1}: ${x.letter}</button>`).join('')}</div><div id="hw-content"></div></div>`}
function drawSheet(){const sh=hwSheets[currentHw], root=document.getElementById('hw-content');if(!root)return;root.innerHTML=`<h3>Sheet ${currentHw+1}: Letter ${sh.letter}</h3><p class="hw-focus"><strong>Focus:</strong> ${sh.focus}</p><div class="hw-section"><h4>1. Letter Practice</h4><p>Write a neat row of each letter across the line.</p>${[sh.upper,sh.lower,sh.upper+sh.lower].map((x,i)=>`<p class="hw-prompt">${x} &nbsp; ${x} &nbsp; — now you try:</p><canvas class="hw-canvas" data-ink="letter${i}" aria-label="Practice ${x}"></canvas>`).join('')}</div><div class="hw-section"><h4>2. Story Words with ${sh.upper}</h4><p>Copy each word from <em>No More Cakes</em> twice. Underline the letter <strong>${sh.lower}</strong> in your writing.</p>${sh.words.map((w,i)=>`<p class="hw-prompt">${w} → Copy twice:</p><canvas class="hw-canvas" data-ink="word${i}" aria-label="Copy ${w} twice"></canvas>`).join('')}</div><div class="hw-section"><h4>3. Sentence Copy</h4><p>Copy this sentence neatly and circle every <strong>${sh.circle}</strong>.</p><p class="hw-prompt">“${sh.sentence}”</p><canvas class="hw-canvas tall" data-ink="sentence" aria-label="Copy the sentence"></canvas></div><div class="hw-actions"><button id="hw-save">💾 Save Handwriting</button><button id="hw-clear">🧽 Clear This Sheet</button></div><p id="hw-status" role="status" class="hw-note">Handwriting is stored in this browser on this device.</p>`;
root.querySelectorAll('canvas').forEach(canvas=>{const dpr=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.round(rect.height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.strokeStyle='#17314a';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';const key=`nzrail_hw_${currentHw}_${canvas.dataset.ink}`;try{const data=localStorage.getItem(key);if(data){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=data}}catch(e){}let down=false;const pos=e=>{const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.01,y+.01);ctx.stroke()});canvas.addEventListener('pointermove',e=>{if(!down)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()});const end=()=>{if(!down)return;down=false;try{localStorage.setItem(key,canvas.toDataURL('image/png'))}catch(e){document.getElementById('hw-status').textContent='Storage is full; try clearing an older sheet.'}};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end)});
document.getElementById('hw-save').onclick=()=>{root.querySelectorAll('canvas').forEach(c=>{try{localStorage.setItem(`nzrail_hw_${currentHw}_${c.dataset.ink}`,c.toDataURL('image/png'))}catch(e){}});document.getElementById('hw-status').textContent='✓ Sheet saved on this device!'};document.getElementById('hw-clear').onclick=()=>{if(!confirm('Clear all handwriting on this sheet?'))return;root.querySelectorAll('canvas').forEach(c=>{c.getContext('2d').clearRect(0,0,c.width,c.height);localStorage.removeItem(`nzrail_hw_${currentHw}_${c.dataset.ink}`)});document.getElementById('hw-status').textContent='Sheet cleared.'}}

const stations={home:{name:'Home Station',city:'Auckland',icon:'🏠',sub:'Your journey begins here!'},reading:{name:'Reading Station',city:'Hamilton',icon:'📚',sub:'Discover new worlds through books.'},handwriting:{name:'Handwriting Station',city:'Wellington',icon:'✏️',sub:'Practise your letters and handwriting.'},writing:{name:'Writing Station',city:'Christchurch',icon:'📝',sub:'Let your ideas travel onto the page.'}};
function writingMarkup(){return `<div class="writing-work"><div class="panel"><span class="ticket">📝 WRITING CHALLENGE</span><h3>Power-Up Your Sentences!</h3><p><strong>Goal:</strong> Make plain, everyday sentences more exciting and descriptive by adding strong <strong>high-frequency adjectives</strong> (describing words) and clear details—without overloading your sentences.</p></div><div class="panel"><h3>Part 1: Adjective Upgrades (Warm-Up)</h3><p>Below are four plain sentences. Rewrite each one by swapping out the <u>underlined weak adjective</u> for a stronger, everyday describing word from the Word Bank (or one of your own).</p><div class="wordchips"><strong>Word Bank:</strong> ancient • freezing • rough • silent • golden • stormy • hollow</div>${[['The <u>cold</u> wind blew through the trees.','cold'],['We walked along the <u>big</u> beach at sunset.','big'],['She knocked on the <u>old</u> wooden door.','old'],['The <u>quiet</u> hallway felt creepy at night.','quiet']].map((x,i)=>`<div class="prompt"><strong>${i+1}.</strong> ${x[0]}</div><label for="write-up-${i}">Upgrade:</label><textarea id="write-up-${i}" data-write="upgrade${i+1}" placeholder="Rewrite the whole sentence here..."></textarea>`).join('')}</div><div class="panel"><h3>Part 2: Stretch the Sentence</h3><p>Take this short, simple sentence and build it up step-by-step:</p><div class="prompt"><strong>Starter Sentence:</strong> <em>The dog ran across the park.</em></div>${['Step 1 — Add ONE adjective to describe the dog:','Step 2 — Add ONE adjective to describe the park:','Step 3 — Add WHERE or WHY he was running to finish your powerhouse sentence:'].map((q,i)=>`<label for="write-step-${i}">${q}</label><textarea id="write-step-${i}" data-write="step${i+1}" placeholder="Write your sentence here..."></textarea>`).join('')}</div><div class="panel"><h3>Part 3: The “Snapshot” Paragraph (Your Turn to Write)</h3><p>Pick <strong>one</strong> of the scenes below and write a short paragraph (<strong>4 to 5 sentences</strong>) describing what is happening as if you are taking a photo with your words:</p>${['Option A: Stepping outside on a frosty winter morning','Option B: Exploring an abandoned, overgrown backyard','Option C: Waiting at a busy skatepark or sports field before a game'].map((q,i)=>`<label class="choice"><input type="radio" name="snapshot-scene" value="${'ABC'[i]}">${q}</label>`).join('')}<label for="snapshot">My Snapshot Paragraph:</label><textarea id="snapshot" class="long-answer" data-write="snapshot" placeholder="Write 4 to 5 descriptive sentences here..."></textarea></div><div class="panel"><button class="action" id="savewriting">💾 Save My Writing Work</button><span class="status" id="writingstatus" role="status"></span><p class="subtle">Your writing is saved in this browser on this device. It will not automatically sync to other devices.</p></div></div>`}
function initWriting(){const fields=[...view.querySelectorAll('[data-write]')],radios=[...view.querySelectorAll('input[name="snapshot-scene"]')];let data={};try{data=JSON.parse(localStorage.getItem('nzrail_writing')||'{}')}catch(e){}fields.forEach(f=>f.value=data[f.dataset.write]||'');radios.forEach(r=>r.checked=r.value===data.scene);const save=()=>{const next={};fields.forEach(f=>next[f.dataset.write]=f.value);next.scene=radios.find(r=>r.checked)?.value||'';try{localStorage.setItem('nzrail_writing',JSON.stringify(next));document.getElementById('writingstatus').textContent='✓ Writing work saved on this device!'}catch(e){document.getElementById('writingstatus').textContent='Unable to save in this browser.'}};document.getElementById('savewriting').onclick=save;}

">. When he found out there were none left, he swallowed his friend whole!</p><p>As the cat walked down the road, he met an old man with a <input aria-label="Blank 4" data-answer="cloze4" class="blank" autocomplete="off">. Even though the old man warned him to move, the cat gobbled them both up. Next, the cat met a king and a queen travelling with their soldiers and <input aria-label="Blank 5" data-answer="cloze5" class="blank" autocomplete="off">. Once again, the greedy cat swallowed the entire group.</p><p>Finally, the cat ran into some <input aria-label="Blank 6" data-answer="cloze6" class="blank" autocomplete="off">. They threatened to nip him, so he ate them too. Inside the cat, it was very dark, and there was a big crowd. Using their sharp claws, the crabs began to cut a <input aria-label="Blank 7" data-answer="cloze7" class="blank" autocomplete="off"> in the cat. Once it was wide enough, everyone climbed out and went home. The cat was left behind to <input aria-label="Blank 8" data-answer="cloze8" class="blank" autocomplete="off"> up his coat.</p></div><button class="action" id="checkcloze">✓ Check Cloze Answers</button><span id="clozestatus" class="status" role="status"></span></article><article class="panel"><h3>📝 Part 2: Comprehension Questions</h3><h4>Literal (Right There in the Text)</h4><label class="question">1. Why did the cat eat his friend, the parrot?<textarea data-answer="q1" placeholder="Type your answer..."></textarea></label><label class="question">2. Who was the very last group of creatures the cat swallowed?<textarea data-answer="q2" placeholder="Type your answer..."></textarea></label><label class="question">3. In what order did the characters climb out of the cat at the end of the story?<textarea data-answer="q3" placeholder="Type your answer..."></textarea></label><h4>Inferential (Thinking Beyond the Text)</h4><label class="question">4. Why were the landcrabs able to escape when the elephants and soldiers could not?<textarea data-answer="q4" placeholder="Use evidence from the story..."></textarea></label><label class="question">5. How did the cat’s attitude change from the beginning of the story to the very last page?<textarea data-answer="q5" placeholder="Explain your thinking..."></textarea></label><h4>Language Link (Connecting to Your Adjectives Goal)</h4><label class="question">6. The text says, <em>“There was a <strong>big</strong> crowd inside the cat. It was <strong>dark</strong>...”</em> Swap <strong>big</strong> and <strong>dark</strong> for two stronger high-frequency adjectives (for example: <em>crowded, noisy, shadowy, gloomy</em>) to make the scene sound even more vivid.<textarea data-answer="q6" placeholder="Write your improved description..."></textarea></label></article><div class="reading-save"><button class="action" id="savereading">💾 Save My Reading Work</button><span class="status" id="readingstatus" role="status"></span><p class="instruction">Answers are saved on this device and browser only. They do not sync between devices.</p></div></div>`;}else if(id==='home'){html+=`<div class="grid"><article class="panel"><h3>🎯 Today's Learning</h3><p><strong>I am learning to use high-frequency adjectives in my poem.</strong></p><h4>Success Criteria:</h4><ul><li>I can choose strong, everyday adjectives (such as <em>ancient, silent, pale, rough</em>) instead of simple “telling” words (<em>big, nice, good</em>).</li><li>I can use <strong>4 to 6</strong> high-frequency adjectives across my poem to build imagery and mood.</li><li>I can keep my lines sharp by using <strong>only one adjective per noun</strong>.</li></ul><p class="instruction">Display only — students cannot edit this section.</p></article><article class="panel mini"><h3>⚡ Mini Task</h3><h4>1. Warm-Up: Spot the Difference (3 Minutes)</h4><p>Read these two lines and picture them in your head:</p><p><strong>Line A:</strong> The <strong>big</strong>, <strong>dark</strong> forest was <strong>scary</strong>.</p><p><strong>Line B:</strong> The <strong>ancient</strong>, <strong>shadowy</strong> forest felt <strong>silent</strong>.</p><p>Notice how both lines describe the exact same forest, and both use common, everyday words. Line B paints a much clearer picture because <strong>ancient</strong>, <strong>shadowy</strong>, and <strong>silent</strong> show you what the forest looks, feels, and sounds like. Today, you are going to use strong, everyday adjectives like these to bring your own poem to life.</p><hr><h4>2. See How It Works: The “One Adjective” Rule (5 Minutes)</h4><p>Read this short poem and look at the bold describing words:</p><blockquote><strong>Cold</strong> air bites my <strong>numb</strong> fingers,<br><strong>Grey</strong> clouds swallow the <strong>pale</strong> sun.<br><strong>Heavy</strong> boots crunch on <strong>frozen</strong> grass,<br>Morning has begun.</blockquote><p>Poets don't need giant, complicated dictionary words to make a poem sound great—and they don't pile three or four adjectives onto a single thing (like <em>“the cold, wet, freezing, icy grass”</em>). Instead, pick <strong>one sharp adjective</strong> for a noun so every word earns its spot.</p><h4>Quick Practice:</h4><p>Look at this plain sentence:</p><blockquote>“The <strong>loud</strong> rain hit the <strong>old</strong> roof.”</blockquote><p>Swap <strong>loud</strong> and <strong>old</strong> for two stronger everyday adjectives (for example: <em>heavy, drumming, rusted, tin</em>). Say your new version out loud to hear the difference.</p><hr><h4>3. Your Turn to Write (9 Minutes)</h4><p>Write a <strong>4- to 6-line poem</strong> about a place or moment you know well. Pick one of these ideas, or choose your own:</p><ul><li>At the Beach</li><li>A Busy Street</li><li>Late at Night</li><li>Right After the Rain</li></ul><p>Use the word bank below if you get stuck, and try to describe at least <strong>two different senses</strong> (what you see, hear, touch, or smell).</p><div class="wordbank"><table><thead><tr><th>Sight &amp; Light</th><th>Touch &amp; Texture</th><th>Sound &amp; Mood</th></tr></thead><tbody><tr><td>pale, bright, shadowed, faded, golden, misty, empty</td><td>rough, damp, sharp, smooth, brittle, heavy, freezing</td><td>silent, distant, wild, gentle, hollow, restless, calm</td></tr></tbody></table></div><p class="instruction">Display only — students cannot edit this section.</p></article></div><div class="checkin"><h3>💬 My Learning Check-In</h3><label for="reflection">What did you learn today, and how did you learn it?</label><textarea id="reflection" placeholder="Today I learned... I learned this by..."></textarea><div><button class="action" id="save">💾 Save My Reflection</button><span class="status" id="status" role="status"></span></div><p class="instruction">Saved on this device and browser only.</p></div>`}else if(id==='handwriting'){html+=handwritingMarkup()}else if(id==='writing'){html+=writingMarkup()}else{html+=`<div class="placeholder"><div class="big">${s.icon}</div><h3>Platform ready — lessons coming soon!</h3><p>This station is empty for now. Your teacher will add the learning resources and activities when they are ready.</p><p class="instruction">No activities have been added yet.</p></div>`}view.innerHTML=html;if(id==='writing')initWriting();if(id==='handwriting'){view.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>{currentHw=Number(b.dataset.sheet);view.querySelectorAll('[data-sheet]').forEach(t=>t.classList.toggle('active',Number(t.dataset.sheet)===currentHw));drawSheet()});drawSheet()}if(id==='reading'){const fields=[...view.querySelectorAll('[data-answer]')];let saved={};try{saved=JSON.parse(localStorage.getItem('nzrail_reading')||'{}')}catch(e){}fields.forEach(f=>f.value=saved[f.dataset.answer]||'');const save=()=>{const data={};fields.forEach(f=>data[f.dataset.answer]=f.value);try{localStorage.setItem('nzrail_reading',JSON.stringify(data));document.getElementById('readingstatus').textContent='✓ Reading work saved on this device!'}catch(e){document.getElementById('readingstatus').textContent='Unable to save in this browser.'}};document.getElementById('savereading').onclick=save;document.getElementById('checkcloze').onclick=()=>{const answers=['parrot','cakes','hungry','donkey','elephants','landcrabs','hole','sew'];let correct=0;answers.forEach((a,i)=>{const f=view.querySelector('[data-answer="cloze'+(i+1)+'"]');const ok=f.value.trim().toLowerCase()===a;f.classList.toggle('correct',ok);f.classList.toggle('incorrect',!ok);if(ok)correct++});document.getElementById('clozestatus').textContent=correct+' of 8 correct. Check highlighted blanks and try again.';save()}}if(id==='home'){const ta=document.getElementById('reflection');ta.value=localStorage.getItem('nzrail_reflection')||'';document.getElementById('save').onclick=()=>{try{localStorage.setItem('nzrail_reflection',ta.value);document.getElementById('status').textContent='✓ Saved on this device!'}catch(e){document.getElementById('status').textContent='Unable to save in this browser.'}}}}document.querySelectorAll('.stop').forEach(b=>b.addEventListener('click',()=>render(b.dataset.station)));render('home');
</script></body></html>
